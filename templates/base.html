<!DOCTYPE html>
<html lang="en" data-bs-theme="light">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}IPO Tracker - Grey Market Premium{% endblock %}</title>
    
    <!-- PWA Meta Tags -->
    <meta name="description" content="Track IPO Grey Market Premium with real-time updates and notifications">
    <meta name="theme-color" content="#ffffff">
    <link rel="manifest" href="/manifest.json">
    
    <!-- Icons -->
    <link rel="icon" type="image/png" sizes="192x192" href="/static/icons/icon-192.png">
    <link rel="icon" type="image/png" sizes="512x512" href="/static/icons/icon-512.png">
    <link rel="apple-touch-icon" href="/static/icons/icon-192.png">
    
    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    
    <!-- Custom CSS -->
    <link href="{{ url_for('static', filename='style.css') }}?v=5" rel="stylesheet">
    
    <!-- Feather Icons -->
    <script src="https://unpkg.com/feather-icons"></script>
</head>
<body class="bg-light">
    <!-- Navigation -->
    <nav class="navbar navbar-expand-lg navbar-light bg-white shadow-sm">
        <div class="container">
            <a class="navbar-brand d-flex align-items-center fw-bold text-primary" href="/">
                <i data-feather="trending-up" class="me-2"></i>
                IPO Tracker
            </a>
            
            <button class="navbar-toggler border-0" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
                <span class="navbar-toggler-icon"></span>
            </button>
            
            <div class="collapse navbar-collapse" id="navbarNav">
                <ul class="navbar-nav ms-auto">
                    <li class="nav-item">
                        <button class="btn btn-outline-primary btn-sm rounded-pill" id="notificationBtn">
                            <i data-feather="bell" class="me-1"></i>
                            <span id="notificationText">Enable Alerts</span>
                        </button>
                    </li>
                    <li class="nav-item dropdown ms-2">
                        <a class="nav-link dropdown-toggle text-dark" href="#" role="button" data-bs-toggle="dropdown">
                            <i data-feather="settings" class="me-1"></i>
                        </a>
                        <ul class="dropdown-menu">
                            <li><a class="dropdown-item" href="#" onclick="manualScrape()">Refresh Data</a></li>
                            <li><a class="dropdown-item" href="#" onclick="testNotification()">Test Alert</a></li>
                        </ul>
                    </li>
                </ul>
            </div>
        </div>
    </nav>

    <!-- Main Content -->
    <main class="container-fluid px-3 py-4">
        {% if error %}
        <div class="alert alert-danger border-0 rounded-3" role="alert">
            <i data-feather="alert-circle" class="me-2"></i>
            {{ error }}
        </div>
        {% endif %}
        
        {% block content %}{% endblock %}
    </main>

    <!-- Footer -->
    <footer class="bg-white border-top py-3">
        <div class="container text-center">
            <p class="small text-muted mb-1">
                <i data-feather="info" class="me-1"></i>
                Real-time IPO Grey Market Premium Updates
            </p>
            <p class="small text-muted mb-0">
                Data from ipowatch.in • Updated: <span id="lastUpdated">Loading...</span>
            </p>
        </div>
    </footer>

    <!-- Bootstrap JS -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    
    <!-- App JavaScript -->
    <script src="{{ url_for('static', filename='app.js') }}?v=4"></script>
    
    <!-- Initialize Feather Icons -->
    <script>feather.replace()</script>
    
    {% block scripts %}{% endblock %}
</body>
</html>
